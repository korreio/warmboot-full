name: Bug report
description: Something in the installer or the instructions does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Report security problems privately through the Security tab, not here.
  - type: input
    id: edition
    attributes:
      label: Edition
      description: Warmboot Light or Warmboot Full.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Output or behaviour, with any error message.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
